name: zay
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.0
  flutter_html: ^3.0.0
  google_fonts: ^8.1.0
  image_picker: ^1.2.2
  firebase_core: ^4.9.0
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  share_plus: ^13.2.0
  app_bar_with_search_switch: ^1.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
